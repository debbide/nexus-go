name: Build Private Docker Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Generate .env from Secrets
        run: |
          echo "UUID=${{ secrets.MY_UUID }}" > .env
          echo "PORT=${{ vars.MY_PORT || '3000' }}" >> .env
          echo "CF_TUNNEL_TOKEN=${{ secrets.CF_TUNNEL_TOKEN }}" >> .env
          # 根据需要继续增加变量，例如探针参数等
          # echo "NEZHA_SERVER=${{ secrets.NEZHA_SERVER }}" >> .env
          # echo "NEZHA_KEY=${{ secrets.NEZHA_KEY }}" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 如果需要推送到 Docker Hub 或 GHCR，取消这里的注释并配置正确的用户名/Token
      # - name: Login to Docker Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # 改为 true 就会推送到云端镜像库
          push: false 
          # 替换为您自己的镜像名字和标签
          tags: my-private-nexus:latest
