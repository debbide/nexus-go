name: Build Private Docker Image

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: '构建的镜像名称 (默认: nexus-go)'
        required: true
        default: 'nexus-go'
        type: string
      uuid:
        description: 'UUID (必填)'
        required: true
        default: '7bd180e8-1142-4387-93f5-03e8d750a896'
        type: string
      port:
        description: 'Web 服务监听端口 (默认 3000)'
        required: false
        default: '3000'
        type: string
      cf_token:
        description: 'CF Tunnel Token (选填)'
        required: false
        type: string
      domain:
        description: '自定义域名 (选填)'
        required: false
        type: string
      sub_path:
        description: '订阅隐藏路径 (默认 sub)'
        required: false
        default: 'sub'
        type: string
      auto_access:
        description: '自动保活 AUTO_ACCESS (选填，true/false)'
        required: false
        type: string
      wspath:
        description: 'WS 路径 (选填，留空取 UUID 前8位)'
        required: false
        type: string
      node_name:
        description: '节点名称 NAME (选填)'
        required: false
        type: string
      nezha_server:
        description: '哪吒探针地址 (选填)'
        required: false
        type: string
      nezha_key:
        description: '哪吒探针密钥 (选填)'
        required: false
        type: string
      tuic_port:
        description: 'TUIC 监听端口 (默认 30018)'
        required: false
        default: '30018'
        type: string
      tuic_domain:
        description: 'TUIC 自签证书域名 (选填)'
        required: false
        type: string
      tuic_password:
        description: 'TUIC 密码 (选填，留空同 UUID)'
        required: false
        type: string

# 允许上传镜像到 GitHub 的包管理器
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Generate .env from Inputs
        run: |
          echo "UUID=${{ inputs.uuid }}" > .env
          echo "PORT=${{ inputs.port }}" >> .env
          echo "CF_TUNNEL_TOKEN=${{ inputs.cf_token }}" >> .env
          echo "DOMAIN=${{ inputs.domain }}" >> .env
          echo "SUB_PATH=${{ inputs.sub_path }}" >> .env
          echo "AUTO_ACCESS=${{ inputs.auto_access }}" >> .env
          echo "WSPATH=${{ inputs.wspath }}" >> .env
          echo "NAME=${{ inputs.node_name }}" >> .env
          echo "NEZHA_SERVER=${{ inputs.nezha_server }}" >> .env
          echo "NEZHA_KEY=${{ inputs.nezha_key }}" >> .env
          echo "TUIC_PORT=${{ inputs.tuic_port }}" >> .env
          echo "TUIC_DOMAIN=${{ inputs.tuic_domain }}" >> .env
          echo "TUIC_PASSWORD=${{ inputs.tuic_password }}" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 自动登录 GitHub 容器注册表 (GHCR)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建并直接推送 (push: true)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true 
          # 镜像名称格式: ghcr.io/用户名/填写的镜像名:latest
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:latest
