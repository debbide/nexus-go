name: Build Private Docker Image

on:
  workflow_dispatch:
    inputs:
      uuid:
        description: '您的专属 UUID (必填)'
        required: true
        default: '7bd180e8-1142-4387-93f5-03e8d750a896'
        type: string
      port:
        description: 'Web 服务监听端口 (默认 3000)'
        required: false
        default: '3000'
        type: string
      cf_token:
        description: 'Cloudflare Tunnel Token (选填，留空则不开启)'
        required: false
        type: string
      # 您可以在这里依葫芦画瓢继续添加更多输入框，比如 nezha_server 等

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Generate .env from Inputs
        run: |
          echo "UUID=${{ inputs.uuid }}" > .env
          echo "PORT=${{ inputs.port }}" >> .env
          echo "CF_TUNNEL_TOKEN=${{ inputs.cf_token }}" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Login to Docker Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false 
          tags: my-private-nexus:latest
